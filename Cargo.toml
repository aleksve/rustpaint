[package]
name = "rustpaint"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "A modern, cross-platform Paint clone written in Rust (Windows, macOS, Linux)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["paint", "drawing", "egui", "graphics", "cross-platform"]
categories = ["graphics", "gui"]

[dependencies]
# Windowing + immediate mode GUI. `glow` = OpenGL backend (works everywhere,
# including software rendering / remote desktops).
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Decoding / encoding of PNG, JPEG, BMP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Rasterising canvas text into the pixel buffer. `ab_glyph` (via ttf-parser)
# handles both TrueType and CFF/OTF outlines, so any system font works.
ab_glyph = "0.2"
# Enumerating the fonts installed on the machine (pure Rust, no system SDK).
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Native "Open / Save" panels (IFileDialog on Windows, NSOpenPanel on macOS).
rfd = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
# Replace an existing file atomically after encoding a temporary sibling.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux rfd talks to the XDG desktop portal over D-Bus. The built-in file
# browser is used automatically when no portal is available.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 3
# Full LLVM LTO lets the optimizer see across crate boundaries. This is slower
# to compile than thin LTO, but produces the fastest release binary here.
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
